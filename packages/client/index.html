<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Goblin Hoard</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <h1>Goblin Hoard</h1>
        <div id="stats"></div>
      </header>
      <main id="board-wrap">
        <canvas id="board"></canvas>
      </main>
      <aside id="side">
        <section id="tools">
          <h2>Overseer</h2>
          <p class="hint">Pick a thing to place, then click a tile. Goblins decide for themselves whether to care.</p>
          <div id="tool-buttons"></div>
        </section>
        <section id="log-section">
          <h2>What the goblins did</h2>
          <ul id="log"></ul>
        </section>
        <section id="debug">
          <button id="reset">New hoard</button>
        </section>
      </aside>
      <div id="return-report" class="hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
